# Production deployment contract.
# This file never builds local product stubs. Every service image must be supplied
# explicitly as an immutable registry reference (prefer image@sha256:digest).
services:
  gateway:
    image: ${GATEWAY_IMAGE:?GATEWAY_IMAGE must reference a published gateway image}
    ports:
      - "8000:8000"
    environment:
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?GATEWAY_API_KEY is required}
      MCP_GATEWAY_API_KEY: ${MCP_GATEWAY_API_KEY:?MCP_GATEWAY_API_KEY is required}
      LLM_REDTEAM_API_KEY: ${LLM_REDTEAM_API_KEY:?LLM_REDTEAM_API_KEY is required}
      DATASET_POISON_API_KEY: ${DATASET_POISON_API_KEY:?DATASET_POISON_API_KEY is required}
      MODEL_PRIVACY_API_KEY: ${MODEL_PRIVACY_API_KEY:?MODEL_PRIVACY_API_KEY is required}
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    depends_on:
      mcp-gateway:
        condition: service_healthy
      llm-redteam:
        condition: service_healthy
      dataset-poison:
        condition: service_healthy
      model-privacy:
        condition: service_healthy
    networks: [mlsec-internal]
    restart: unless-stopped

  mcp-gateway:
    image: ${MCP_GATEWAY_IMAGE:?MCP_GATEWAY_IMAGE must reference the real MCP gateway image}
    environment:
      MCP_ENV: production
      MCP_API_KEY: ${MCP_GATEWAY_API_KEY:?MCP_GATEWAY_API_KEY is required}
      MCP_ALLOW_ANONYMOUS: "false"
      MCP_ALLOWED_SERVERS: ${MCP_ALLOWED_SERVERS:?MCP_ALLOWED_SERVERS is required}
      MCP_WAL_PATH: /var/lib/mcp/wal.jsonl
      MCP_AUDIT_PATH: /var/lib/mcp/audit.jsonl
    volumes:
      - mcp-state:/var/lib/mcp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/ready', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [mlsec-internal]
    restart: unless-stopped

  llm-redteam:
    image: ${LLM_REDTEAM_IMAGE:?LLM_REDTEAM_IMAGE must reference the real LLM red-team HTTP image}
    environment:
      REDTEAM_API_KEY: ${LLM_REDTEAM_API_KEY:?LLM_REDTEAM_API_KEY is required}
      REDTEAM_ENFORCEMENT_MODE: "block"
      REDTEAM_SCAN_TIMEOUT_SECONDS: ${REDTEAM_SCAN_TIMEOUT_SECONDS:-30}
      REDTEAM_MAX_CONCURRENT_SCANS: ${REDTEAM_MAX_CONCURRENT_SCANS:-8}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [mlsec-internal]
    restart: unless-stopped

  dataset-poison:
    image: ${DATASET_POISON_IMAGE:?DATASET_POISON_IMAGE must reference the real dataset detector HTTP image}
    environment:
      API_KEY: ${DATASET_POISON_API_KEY:?DATASET_POISON_API_KEY is required}
      POISON_ENVIRONMENT: "production"
      POISON_BASELINE_PATH: /etc/mlsec/baseline.npz
      POISON_REDIS_URL: ${POISON_REDIS_URL:?POISON_REDIS_URL is required}
      POISON_SCORE_TIMEOUT_SECONDS: ${POISON_SCORE_TIMEOUT_SECONDS:-30}
      POISON_MAX_INFLIGHT_SCORING: ${POISON_MAX_INFLIGHT_SCORING:-16}
    volumes:
      - ${DATASET_BASELINE_FILE:?DATASET_BASELINE_FILE must point to a known-clean NPZ baseline}:/etc/mlsec/baseline.npz:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [mlsec-internal]
    restart: unless-stopped

  model-privacy:
    image: ${MODEL_PRIVACY_IMAGE:?MODEL_PRIVACY_IMAGE must reference the real privacy assessment service image}
    environment:
      API_KEY: ${MODEL_PRIVACY_API_KEY:?MODEL_PRIVACY_API_KEY is required}
      PRIVACY_MAX_REQUEST_BYTES: ${PRIVACY_MAX_REQUEST_BYTES:-4194304}
      PRIVACY_ASSESS_TIMEOUT_SECONDS: ${PRIVACY_ASSESS_TIMEOUT_SECONDS:-30}
      PRIVACY_MAX_CONCURRENT_ASSESSMENTS: ${PRIVACY_MAX_CONCURRENT_ASSESSMENTS:-4}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/ready', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [mlsec-internal]
    restart: unless-stopped

networks:
  mlsec-internal:
    driver: bridge
    internal: true

volumes:
  mcp-state: