name: Signed Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.2.3)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write  # Required for sigstore signing
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===========================================================================
  # Job 1: Run full test suite before release
  # ===========================================================================
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=gateway --cov=products --cov-report=xml --cov-report=term-missing -v
          pytest benchmarks/gateway_perf.py -v

      - name: Check coverage threshold
        run: |
          coverage report --fail-under=90

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  # ===========================================================================
  # Job 2: Build distribution artifacts
  # ===========================================================================
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.version.outputs.version }}
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Verify distributions
        run: |
          twine check dist/*

      - name: Generate SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment -o sbom.json --format json
          cp sbom.json dist/

      - name: Compute artifact hashes
        id: hash
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          HASHES=$(cat SHA256SUMS.txt | base64 -w0)
          echo "hashes=${HASHES}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 5

  # ===========================================================================
  # Job 3: Sign artifacts with Sigstore
  # ===========================================================================
  sign:
    name: Sign Artifacts
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write  # OIDC token for Sigstore
      contents: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          name: dist
          path: dist/

      - name: Install Sigstore
        run: |
          python -m pip install sigstore

      - name: Sign with Sigstore (keyless)
        run: |
          cd dist
          for file in *.tar.gz *.whl; do
            if [ -f "$file" ]; then
              echo "Signing: $file"
              python -m sigstore sign "$file"
            fi
          done

      - name: Verify signatures
        run: |
          cd dist
          for file in *.tar.gz *.whl; do
            if [ -f "$file" ]; then
              echo "Verifying: $file"
              python -m sigstore verify identity \
                --cert-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
                --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
                "$file"
            fi
          done

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-signed
          path: dist/
          retention-days: 5

  # ===========================================================================
  # Job 4: Build and sign container image
  # ===========================================================================
  container:
    name: Container Image
    runs-on: ubuntu-latest
    needs: [build, test]
    permissions:
      packages: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign container image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      - name: Generate container attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # ===========================================================================
  # Job 5: Create GitHub Release
  # ===========================================================================
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build, sign, container]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          name: dist-signed
          path: dist/

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --max-count=50)
          fi
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: "Release v${{ needs.build.outputs.version }}"
          body: |
            ## Unified ML Security Platform v${{ needs.build.outputs.version }}

            ### Changes
            ${{ steps.changelog.outputs.changelog }}

            ### Verification

            All artifacts are signed with [Sigstore](https://sigstore.dev) keyless signing.
            Container images are signed with cosign and include build provenance attestations.

            **Verify Python packages:**
            ```bash
            pip install sigstore
            sigstore verify identity \
              --cert-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/v${{ needs.build.outputs.version }}" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
              unified_ml_security_platform-${{ needs.build.outputs.version }}.tar.gz
            ```

            **Verify container image:**
            ```bash
            cosign verify \
              --certificate-identity-regexp "https://github.com/${{ github.repository }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.version }}
            ```

            ### Artifacts
            - Source distribution (`.tar.gz`) + Sigstore signature
            - Wheel (`.whl`) + Sigstore signature
            - SBOM (`sbom.json`) — CycloneDX format
            - SHA256 checksums (`SHA256SUMS.txt`)

          files: |
            dist/*.tar.gz
            dist/*.whl
            dist/*.sigstore
            dist/sbom.json
            dist/SHA256SUMS.txt
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true

  # ===========================================================================
  # Job 6: SLSA Provenance (Supply Chain Levels for Software Artifacts)
  # ===========================================================================
  provenance:
    name: SLSA Provenance
    needs: build
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true
