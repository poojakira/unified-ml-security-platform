name: Child Product Contract Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  child-contract:
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: hf-model-provenance-scanner
            install: '.[dev]'
            smoke: 'python -m scanner.cli --version'
          - repo: llm-redteam-framework
            install: '.[dev]'
            smoke: 'python -c "from redteam.detector import RedTeamDetector; print(RedTeamDetector.__name__)"'
          - repo: dataset-poisoning-detector
            install: '.[dev]'
            smoke: 'python -c "from poison_detector.detector import detect; print(detect([[0.0],[1.0]], method=\"zscore\").total_samples)"'
          - repo: model-privacy-attacks
            install: '.'
            smoke: 'python -c "import privacy_attacks; print(privacy_attacks.__name__)"'
          - repo: mcp-agent-security-gateway
            install: '.'
            smoke: 'python -c "import mcp_monitor; print(mcp_monitor.__name__)"'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: platform
      - name: Checkout child product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: poojakira/${{ matrix.repo }}
          path: child
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install child product
        working-directory: child
        run: python -m pip install -e "${{ matrix.install }}"
      - name: Exercise declared child interface
        working-directory: child
        run: ${{ matrix.smoke }}
      - name: Record exact child revision
        run: |
          mkdir -p platform/validation/child-revisions
          git -C child rev-parse HEAD > "platform/validation/child-revisions/${{ matrix.repo }}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: child-contract-${{ matrix.repo }}
          path: platform/validation/child-revisions/${{ matrix.repo }}.txt

  platform-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Run platform cross-service contracts
        run: python -m pytest tests/integration tests/test_common_and_products.py -q
