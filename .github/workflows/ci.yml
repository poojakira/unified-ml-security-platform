name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -q ruff pyright bandit safety

      - name: Lint with Ruff
        run: ruff check . --output-format=github

      - name: Type check with Pyright
        run: pyright

      - name: Security scan with Bandit
        # bandit is now blocking — || true removed.
        # If Bandit finds HIGH/MEDIUM severity issues, this job fails.
        # SARIF upload in "if: always()" ensures results are visible even on failure.
        run: |
          bandit -r . -f json -o bandit-report.json -ll
          python <<'PY'
          import json
          import sys

          with open("bandit-report.json", encoding="utf-8") as fh:
              data = json.load(fh)
          high_med = [
              r
              for r in data.get("results", [])
              if r["issue_severity"] in ("HIGH", "MEDIUM")
          ]
          if high_med:
              print(f"FAIL: {len(high_med)} HIGH/MEDIUM bandit findings")
              sys.exit(1)
          print("PASS: No HIGH/MEDIUM Bandit findings")
          PY
      - name: Dependency audit with Safety
        # safety check is now blocking — || true removed.
        # Known CVEs in dependencies will fail this job.
        run: safety check --output json > safety-report.json

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -q pytest pytest-cov pytest-asyncio
          pip install -e .[dev] -q 2>&1 | tail -5

      - name: Run tests
        env:
          API_KEY: test-api-key-that-is-at-least-32-characters-long
        run: |
          pytest tests/ --ignore=tests/integration -v --tb=short \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=25

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  contract-stub-health-tests:
    name: Local Contract Stub Health Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pulsenet removed — archived project not built in active platform
        product: [mcp_gateway, llm_redteam, dataset_poison, model_privacy]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install test deps only
        run: |
          pip install fastapi uvicorn[standard] httpx pytest pytest-cov
          pip install -e .

      - name: Test local stub health contract
        env:
          MLSEC_API_KEY: test-key-ci
        run: |
          pytest -o addopts="" products/${{ matrix.product }}/tests/ -v --tb=short \
            --cov=products/${{ matrix.product }} \
            --cov-report=term-missing \
            --cov-fail-under=60

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install integration test dependencies
        run: |
          pip install pytest pytest-asyncio httpx docker
          pip install -r requirements.txt

      - name: Build integration topology
        env:
          API_KEY: integration-test-api-key-32-bytes-minimum
          PULSENET_JWT_SECRET: integration-test-pulsenet-secret-32-bytes-minimum
        run: |
          docker compose -f docker-compose.yml build --parallel

      - name: Start integration topology
        env:
          API_KEY: integration-test-api-key-32-bytes-minimum
          PULSENET_JWT_SECRET: integration-test-pulsenet-secret-32-bytes-minimum
        run: |
          docker compose -f docker-compose.yml up -d
          sleep 30

      - name: Run integration tests
        run: |
          pytest -o addopts="" tests/integration/ -v --tb=short

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml logs --tail=100 > integration-logs.txt

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: integration-logs.txt

  dependency-audit:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e .[dev]

      - name: Audit dependencies (blocking)
        run: pip-audit --skip-editable --progress-spinner=off

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Grype scanner
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439
        env:
          GRYPE_DB_CACHE_DIR: ${{ runner.temp }}/grype-db
        with:
          path: '.'
          fail-build: true
          output-format: sarif
          severity-cutoff: medium
          cache-db: false

      - name: Run Syft for SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          format: spdx-json
          output-file: sbom.spdx.json

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [integration-tests, security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.gateway
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Do not publish stub product images
        run: |
          echo "Product images are built and released by their owning repositories."
          echo "This repository publishes only the gateway; local products/ are integration-contract stubs."
      - name: Sign images with Cosign
        if: env.COSIGN_PRIVATE_KEY != ''
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'latest'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}

      - name: Sign and attest
        if: env.COSIGN_PRIVATE_KEY != ''
        run: |
          for image in ${{ steps.meta.outputs.tags }}; do
            cosign sign --yes "$image"
          done

  validate-staging-deployment-plan:
    name: Validate Staging Deployment Plan
    runs-on: ubuntu-latest
    needs: [integration-tests, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      - name: Validate staging deployment placeholder
        run: |
          echo "No staging deployment is configured in this repository. Add reviewed manifests before enabling deploy."

  validate-production-deployment-plan:
    name: Validate Production Deployment Plan
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Validate production compose contract
        env:
          GATEWAY_IMAGE: ghcr.io/example/control-plane@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          MCP_GATEWAY_IMAGE: ghcr.io/example/mcp@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          LLM_REDTEAM_IMAGE: ghcr.io/example/llm@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          DATASET_POISON_IMAGE: ghcr.io/example/dataset@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
          MODEL_PRIVACY_IMAGE: ghcr.io/example/privacy@sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          GATEWAY_API_KEY: validation-gateway-key-that-is-at-least-32-chars
          MCP_GATEWAY_API_KEY: validation-mcp-service-key-at-least-32-characters
          LLM_REDTEAM_API_KEY: validation-llm-service-key-at-least-32-characters
          DATASET_POISON_API_KEY: validation-dataset-service-key-at-least-32-chars
          MODEL_PRIVACY_API_KEY: validation-privacy-service-key-at-least-32-chars
          MCP_ALLOWED_SERVERS: github
          DATASET_BASELINE_FILE: /tmp/validation-baseline.npz
        run: docker compose -f docker-compose.prod.yml config >/dev/null

  release:
    name: Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint-and-typecheck, unit-tests, security-scan, build-and-push]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true