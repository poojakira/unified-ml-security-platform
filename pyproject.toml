[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-ml-security-platform"
version = "0.1.0"
description = "Architecture spec and ATT&CK detection contract for ML security products."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "ruff>=0.8",
    "pyright>=1.1",
]

[tool.setuptools]
py-modules = ["gateway_server", "spec_service"]
packages = ["attacks", "products", "products.dataset_poison", "products.mcp_gateway", "products.adv_ml", "products.llm_redteam", "products.dataset_poison", "products.model_privacy", "products.hf_scanner", "products.pulsenet"]

[tool.coverage.run]
omit = [
    "attacks/attack_catalog.py",
    "attacks/attack_client.py",
    "gateway_server.py",
    "spec_service.py",
    "products/pulsenet/*",
    "tests/*",
]

[tool.pyright]
include = ["attacks/attack_v19_detector.py", "tests/test_attack_v19_detector.py"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "products/dataset_poison/tests",
    "products/mcp_gateway/tests",
    "products/adv_ml/tests",
    "products/llm_redteam/tests",
    "products/dataset_poison/tests",
    "products/model_privacy/tests",
    "products/hf_scanner/tests",
    "products/pulsenet/tests",
]
addopts = "-ra -q --strict-markers --strict-config --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=25"

[tool.ruff]
include = ["attacks/attack_v19_detector.py", "tests/test_attack_v19_detector.py"]