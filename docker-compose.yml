# LOCAL CONTRACT/ROUTING TEST TOPOLOGY ONLY.
# Product containers are minimal health stubs. Never deploy this file as production.
services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8000:8000"
    environment:
      GATEWAY_API_KEY: ${API_KEY:-development-key-that-is-at-least-32-characters}
      MCP_GATEWAY_API_KEY: ${API_KEY:-development-key-that-is-at-least-32-characters}
      LLM_REDTEAM_API_KEY: ${API_KEY:-development-key-that-is-at-least-32-characters}
      DATASET_POISON_API_KEY: ${API_KEY:-development-key-that-is-at-least-32-characters}
      MODEL_PRIVACY_API_KEY: ${API_KEY:-development-key-that-is-at-least-32-characters}
      LOG_LEVEL: INFO
    depends_on:
      - mcp-gateway
      - llm-redteam
      - dataset-poison
      - model-privacy
    networks: [mlsec-internal]

  mcp-gateway:
    build:
      context: .
      dockerfile: products/mcp_gateway/Dockerfile
    networks: [mlsec-internal]

  llm-redteam:
    build:
      context: .
      dockerfile: products/llm_redteam/Dockerfile
    networks: [mlsec-internal]

  dataset-poison:
    build:
      context: .
      dockerfile: products/dataset_poison/Dockerfile
    networks: [mlsec-internal]

  model-privacy:
    build:
      context: .
      dockerfile: products/model_privacy/Dockerfile
    networks: [mlsec-internal]

networks:
  mlsec-internal:
    driver: bridge
    internal: true
